<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>testtest - 測試頁（含 fallback）</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans',sans-serif;padding:2rem;color:#111}
    .card{background:#fff;border:1px solid #eee;padding:1rem;border-radius:8px;max-width:800px}
    .muted{color:#666}
  </style>
</head>
<body>
  <div class="card">
    <h1>testtest（含 fallback 的穩定版本）</h1>
    <p class="muted">下方會顯示天文台九天天氣預報；若無法取得資料，會顯示友善的錯誤或保留靜態內容。</p>

    <div id="fallback">
      <p>暫時顯示靜態內容：測試成功。如果 fetch 失敗，你仍會看到這段文字。</p>
    </div>

    <div id="result" style="margin-top:1rem;display:none">
      <h2>九天天氣預報</h2>
      <ul id="forecastList"></ul>
    </div>

    <div id="error" style="margin-top:1rem;display:none;color:#a33"></div>

    <p class="muted" style="margin-top:1rem">時間：<span id="time"></span></p>
  </div>

  <script>
    // 顯示時間（立即可見）
    document.getElementById('time').textContent = new Date().toLocaleString();

    // helper: fetch with timeout
    function fetchWithTimeout(url, options = {}, timeout = 8000) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('timeout')), timeout);
        fetch(url, options)
          .then(response => {
            clearTimeout(timer);
            resolve(response);
          })
          .catch(err => {
            clearTimeout(timer);
            reject(err);
          });
      });
    }

    // 嘗試取得天文台九天天氣預報
    (function loadForecast() {
      const url = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc';
      fetchWithTimeout(url, {}, 8000)
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          if (!data || !data.weatherForecast) throw new Error('Unexpected data');
          const list = document.getElementById('forecastList');
          list.innerHTML = '';
          data.weatherForecast.forEach(day => {
            const li = document.createElement('li');
            li.textContent = `${day.forecastDate}: ${day.forecastWeather}，最低 ${day.forecastMintemp.value}${day.forecastMintemp.unit}，最高 ${day.forecastMaxtemp.value}${day.forecastMaxtemp.unit}`;
            list.appendChild(li);
          });

          document.getElementById('fallback').style.display = 'none';
          document.getElementById('result').style.display = '';
          document.getElementById('error').style.display = 'none';
          console.log('天氣資料載入成功');
        })
        .catch(err => {
          console.warn('取得天氣資料失敗：', err);
          const errDiv = document.getElementById('error');
          errDiv.textContent = '無法取得天氣資料（' + err.message + '）。請稍後再試或查看瀏覽器控制台。';
          errDiv.style.display = '';
          // 保留 fallback 顯示
        });
    })();
  </script>
</body>
</html>
