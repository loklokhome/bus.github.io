<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真實巴士到站查詢</title>
    <style>
        :root { --primary: #e74c3c; --bg: #f4f6f8; --card: #fff; --text: #333; --sub: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; color: var(--primary); }
        
        /* 新增路線表單 */
        .add-form { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .add-form input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; min-width: 100px; }
        .add-form button { padding: 10px 15px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; }

        /* 按鈕與卡片 */
        .filter-btn { padding: 8px 15px; border: none; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: 0.3s; background: var(--primary); color: #fff; }
        .filter-btn.active { background: #333; }
        .bus-card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .bus-info h3 { font-size: 1.2rem; margin-bottom: 4px; }
        .bus-info p { font-size: 0.85rem; color: var(--sub); }
        .bus-time { text-align: right; min-width: 80px; }
        .time-text { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        .status { font-size: 0.75rem; color: var(--sub); margin-top: 2px; }
        .delete-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #ccc; margin-right: 10px; }
        .delete-btn:hover { color: #e74c3c; }
        .empty-msg { text-align: center; padding: 40px; color: #aaa; }
        .loading { text-align: center; padding: 20px; color: var(--sub); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚌 真實巴士到站</h1>
        <button id="favToggle" class="filter-btn" onclick="toggleFavoriteView()">只看最愛</button>
    </header>

    <!-- 新增路線表單 -->
    <div class="add-form">
        <input type="text" id="routeInput" placeholder="路線 (如: 1A)">
        <input type="text" id="stopInput" placeholder="車站ID (如: 00001)">
        <button onclick="addFavorite()">➕ 新增</button>
    </div>

    <div id="busList"><div class="loading">載入中...</div></div>
</div>

<script>
    // 1. 狀態管理
    let favorites = JSON.parse(localStorage.getItem('realBusFavorites')) || [];
    let showOnlyFav = false;
    let busDataCache = []; // 暫存查詢結果

    // 2. 初始化：載入儲存的愛线路線
    window.onload = () => {
        if (favorites.length === 0) {
            // 預設示範路線
            favorites = [{ route: "1A", stopId: "00001", stopName: "尖沙咀碼頭" }];
            saveToStorage();
        }
        fetchAllBusData();
    };

    // 3. 核心：並行獲取所有最愛路線的真實 ETA
    async function fetchAllBusData() {
        const listContainer = document.getElementById('busList');
        if (favorites.length === 0) {
            listContainer.innerHTML = '<div class="empty-msg">😴 請新增路線或關閉「只看最愛」</div>';
            return;
        }

        listContainer.innerHTML = '<div class="loading">🔄 正在向 Data.gov.hk 請求數據...</div>';

        // 並行請求所有路線
        const promises = favorites.map(async (fav) => {
            try {
                // 九巴 ETA API (注意：實際使用時需確保 CORS 允許或透過後端代理)
                const url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${fav.route}/${fav.stopId}/1`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('API 請求失敗');
                const json = await res.json();
                
                // 取第一班車的 ETA
                const etaObj = json.data && json.data[0];
                let etaText = "暫無班次";
                let statusText = "";
                
                if (etaObj && etaObj.eta) {
                    const etaTime = new Date(etaObj.eta);
                    const now = new Date();
                    const diffMin = Math.round((etaTime - now) / 60000);
                    etaText = diffMin > 0 ? `${diffMin} 分鐘` : "即將到站";
                    statusText = `預計 ${etaTime.getHours().toString().padStart(2,'0')}:${etaTime.getMinutes().toString().padStart(2,'0')} 到達`;
                }

                return { ...fav, etaText, statusText, error: false };
            } catch (err) {
                console.error(err);
                return { ...fav, etaText: "查詢失敗", statusText: "請檢查路線/車站ID", error: true };
            }
        });

        const results = await Promise.all(promises);
        busDataCache = results;
        renderBusList();
    }

    // 4. 渲染列表
    function renderBusList() {
        const listContainer = document.getElementById('busList');
        listContainer.innerHTML = '';
        
        const displayList = showOnlyFav ? busDataCache : busDataCache; // 這裡因為已經只查 fav，所以直接顯示

        if (displayList.length === 0) {
            listContainer.innerHTML = '<div class="empty-msg">😴 無資料</div>';
            return;
        }

        displayList.forEach((bus, index) => {
            const card = document.createElement('div');
            card.className = 'bus-card';
            card.innerHTML = `
                <button class="delete-btn" onclick="removeFavorite(${index})">✕</button>
                <div class="bus-info">
                    <h3>${bus.route}</h3>
                    <p>往 ${bus.stopName} (ID: ${bus.stopId})</p>
                </div>
                <div class="bus-time">
                    <div class="time-text">${bus.etaText}</div>
                    <div class="status">${bus.statusText}</div>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    // 5. 新增最愛
    function addFavorite() {
        const route = document.getElementById('routeInput').value.trim();
        const stopId = document.getElementById('stopInput').value.trim();
        if (!route || !stopId) return alert("請輸入路線和車站ID");

        // 避免重複
        if (favorites.some(f => f.route === route && f.stopId === stopId)) {
            return alert("該路線已存在！");
        }

        favorites.push({ route, stopId, stopName: "自訂車站" }); // 實際可再查一次 API 獲取真實站名
        saveToStorage();
        fetchAllBusData(); // 重新查詢
        
        // 清空輸入框
        document.getElementById('routeInput').value = '';
        document.getElementById('stopInput').value = '';
    }

    // 6. 刪除最愛
    function removeFavorite(index) {
        favorites.splice(index, 1);
        saveToStorage();
        fetchAllBusData();
    }

    // 7. 切換視圖與自動刷新
    function toggleFavoriteView() {
        showOnlyFav = !showOnlyFav;
        document.getElementById('favToggle').classList.toggle('active', showOnlyFav);
        renderBusList();
    }

    function saveToStorage() {
        localStorage.setItem('realBusFavorites', JSON.stringify(favorites));
    }

    // 每 60 秒自動刷新真實數據
    setInterval(fetchAllBusData, 60000);
</script>
</body>
</html>
