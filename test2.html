<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真實巴士到站查詢</title>
    <style>
        :root { --primary: #e74c3c; --bg: #f4f6f8; --card: #fff; --text: #333; --sub: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; color: var(--primary); }
        
        /* 搜尋與新增表單 */
        .add-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; position: relative; }
        .row { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--primary); }
        button.add-btn { padding: 12px 20px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; white-space: nowrap; }
        button.add-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* 搜尋下拉選單 */
        .dropdown { position: absolute; top: 50px; left: 0; right: 0; background: #fff; border: 1px solid #ddd; border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .dropdown-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .dropdown-item:hover { background: #f9f9f9; }
        .dropdown-item small { color: var(--sub); display: block; margin-top: 2px; }

        /* 按鈕與卡片 */
        .filter-btn { padding: 8px 15px; border: none; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: 0.3s; background: var(--primary); color: #fff; }
        .filter-btn.active { background: #333; }
        .bus-card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .bus-info h3 { font-size: 1.2rem; margin-bottom: 4px; }
        .bus-info p { font-size: 0.85rem; color: var(--sub); }
        .bus-time { text-align: right; min-width: 90px; }
        .time-text { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        .status { font-size: 0.75rem; color: var(--sub); margin-top: 2px; }
        .delete-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #ccc; margin-right: 10px; }
        .delete-btn:hover { color: #e74c3c; }
        .empty-msg { text-align: center; padding: 40px; color: #aaa; }
        .loading { text-align: center; padding: 20px; color: var(--sub); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚌 真實巴士到站</h1>
        <button id="favToggle" class="filter-btn" onclick="toggleFavoriteView()">只看最愛</button>
    </header>

    <!-- 新增路線表單 -->
    <div class="add-form">
        <div class="row">
            <input type="text" id="routeInput" placeholder="路線 (如: 1A)">
            <input type="text" id="stopSearchInput" placeholder="搜尋車站 (如: 尖沙咀)" autocomplete="off">
        </div>
        <button class="add-btn" id="addBtn" onclick="addFavorite()" disabled>➕ 新增至最愛</button>
        
        <!-- 搜尋結果下拉選單 -->
        <div class="dropdown" id="stopDropdown"></div>
    </div>

    <div id="busList"><div class="loading">載入中...</div></div>
</div>

<script>
    // 1. 狀態管理
    let favorites = JSON.parse(localStorage.getItem('realBusFavorites')) || [];
    let showOnlyFav = false;
    let allStops = []; // 暫存官方站點數據
    let selectedStop = null; // 暫存用戶揀選嘅車站

    // 2. 初始化：載入最愛 & 拉取官方站點數據庫
    window.onload = async () => {
        if (favorites.length === 0) {
            favorites = [{ route: "1A", stopId: "66A93A407AB08486", stopName: "尖沙咀碼頭" }];
            saveToStorage();
        }
        fetchAllBusData();
        await loadStopDatabase();
    };

    // 3. 拉取九巴/龍運官方站點數據庫
    async function loadStopDatabase() {
        try {
            const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop/');
            const json = await res.json();
            allStops = json.data || [];
            console.log(`✅ 成功載入 ${allStops.length} 個巴士站`);
        } catch (err) {
            console.error("❌ 無法載入站點數據庫", err);
        }
    }

    // 4. 站名搜尋邏輯 (本地過濾)
    const stopSearchInput = document.getElementById('stopSearchInput');
    const dropdown = document.getElementById('stopDropdown');
    const addBtn = document.getElementById('addBtn');

    stopSearchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.trim();
        selectedStop = null; // 重新打字時清除已選車站
        addBtn.disabled = true;
        
        if (keyword.length === 0) {
            dropdown.style.display = 'none';
            return;
        }

        // 在本地數據庫中搜尋 (最多顯示 8 個)
        const matches = allStops.filter(s => s.name_tc.includes(keyword)).slice(0, 8);
        
        if (matches.length > 0) {
            dropdown.innerHTML = matches.map(s => `
                <div class="dropdown-item" data-id="${s.stop}" data-name="${s.name_tc}">
                    ${s.name_tc}
                    <small>ID: ${s.stop}</small>
                </div>
            `).join('');
            dropdown.style.display = 'block';
        } else {
            dropdown.innerHTML = '<div class="dropdown-item">無相符車站</div>';
            dropdown.style.display = 'block';
        }
    });

    // 點擊下拉選單項目
    dropdown.addEventListener('click', (e) => {
        const item = e.target.closest('.dropdown-item');
        if (item && item.dataset.id) {
            selectedStop = { id: item.dataset.id, name: item.dataset.name };
            stopSearchInput.value = item.dataset.name;
            dropdown.style.display = 'none';
            addBtn.disabled = false; // 允許新增
        }
    });

    // 點擊其他地方關閉下拉選單
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.add-form')) dropdown.style.display = 'none';
    });

    // 5. 核心：並行獲取所有最愛路線的真實 ETA
    async function fetchAllBusData() {
        const listContainer = document.getElementById('busList');
        if (favorites.length === 0) {
            listContainer.innerHTML = '<div class="empty-msg">😴 請新增路線</div>';
            return;
        }

        listContainer.innerHTML = '<div class="loading">🔄 正在請求真實到站數據...</div>';

        const promises = favorites.map(async (fav) => {
            try {
                const url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${fav.route}/${fav.stopId}/1`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('API Error');
                const json = await res.json();
                
                const etaObj = json.data && json.data[0];
                let etaText = "暫無班次";
                let statusText = "";
                
                if (etaObj && etaObj.eta) {
                    const etaTime = new Date(etaObj.eta);
                    const now = new Date();
                    const diffMin = Math.round((etaTime - now) / 60000);
                    etaText = diffMin > 0 ? `${diffMin} 分鐘` : "即將到站";
                    statusText = `預計 ${etaTime.getHours().toString().padStart(2,'0')}:${etaTime.getMinutes().toString().padStart(2,'0')} 到達`;
                }
                return { ...fav, etaText, statusText, error: false };
            } catch (err) {
                return { ...fav, etaText: "查詢失敗", statusText: "請檢查路線/車站", error: true };
            }
        });

        const results = await Promise.all(promises);
        renderBusList(results);
    }

    // 6. 渲染列表
    function renderBusList(list) {
        const listContainer = document.getElementById('busList');
        listContainer.innerHTML = '';
        
        if (list.length === 0) {
            listContainer.innerHTML = '<div class="empty-msg">😴 無資料</div>';
            return;
        }

        list.forEach((bus, index) => {
            const card = document.createElement('div');
            card.className = 'bus-card';
            card.innerHTML = `
                <button class="delete-btn" onclick="removeFavorite(${index})">✕</button>
                <div class="bus-info">
                    <h3>${bus.route}</h3>
                    <p>${bus.stopName}</p>
                </div>
                <div class="bus-time">
                    <div class="time-text">${bus.etaText}</div>
                    <div class="status">${bus.statusText}</div>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    // 7. 新增最愛
    function addFavorite() {
        const route = document.getElementById('routeInput').value.trim();
        if (!route || !selectedStop) return alert("請輸入路線並從下拉選單揀選車站");

        if (favorites.some(f => f.route === route && f.stopId === selectedStop.id)) {
            return alert("該路線及車站已存在！");
        }

        favorites.push({ route, stopId: selectedStop.id, stopName: selectedStop.name });
        saveToStorage();
        fetchAllBusData();
        
        // 清空輸入框
        document.getElementById('routeInput').value = '';
        stopSearchInput.value = '';
        selectedStop = null;
        addBtn.disabled = true;
    }

    // 8. 刪除最愛
    function removeFavorite(index) {
        favorites.splice(index, 1);
        saveToStorage();
        fetchAllBusData();
    }

    // 9. 切換視圖與自動刷新
    function toggleFavoriteView() {
        showOnlyFav = !showOnlyFav;
        document.getElementById('favToggle').classList.toggle('active', showOnlyFav);
        // 因為目前系統只查 fav，所以切換視圖主要係 UI 概念，這裡保持簡單直接重新渲染
        fetchAllBusData(); 
    }

    function saveToStorage() {
        localStorage.setItem('realBusFavorites', JSON.stringify(favorites));
    }

    // 每 60 秒自動刷新真實數據
    setInterval(fetchAllBusData, 60000);
</script>
</body>
</html>
