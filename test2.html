<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能巴士到站查詢</title>
    <style>
        :root { --primary: #e74c3c; --bg: #f4f6f8; --card: #fff; --text: #333; --sub: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; color: var(--primary); }
        
        /* 搜尋與新增表單 */
        .add-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; position: relative; }
        .row { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--primary); }
        button.add-btn { padding: 12px 20px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; white-space: nowrap; }
        button.add-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* 搜尋下拉選單 */
        .dropdown { position: absolute; top: 50px; left: 0; right: 0; background: #fff; border: 1px solid #ddd; border-radius: 8px; max-height: 250px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .dropdown-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .dropdown-item:hover { background: #f9f9f9; }
        .dropdown-item small { color: var(--sub); display: block; margin-top: 2px; }

        /* 按鈕與卡片 */
        .filter-btn { padding: 8px 15px; border: none; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: 0.3s; background: var(--primary); color: #fff; }
        .filter-btn.active { background: #333; }
        .bus-card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .bus-info h3 { font-size: 1.2rem; margin-bottom: 4px; }
        .bus-info p { font-size: 0.85rem; color: var(--sub); }
        .bus-time { text-align: right; min-width: 90px; }
        .time-text { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        .status { font-size: 0.75rem; color: var(--sub); margin-top: 2px; }
        .delete-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #ccc; margin-right: 10px; }
        .delete-btn:hover { color: #e74c3c; }
        .empty-msg { text-align: center; padding: 40px; color: #aaa; }
        .loading { text-align: center; padding: 20px; color: var(--sub); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1> 智能巴士到站</h1>
        <button id="favToggle" class="filter-btn" onclick="toggleFavoriteView()">只看最愛</button>
    </header>

    <!-- 新增路線表單 -->
    <div class="add-form">
        <div class="row">
            <input type="text" id="routeInput" placeholder="輸入路線 (如: 1A)">
            <input type="text" id="stopSearchInput" placeholder="請先輸入路線..." autocomplete="off" disabled>
        </div>
        <button class="add-btn" id="addBtn" onclick="addFavorite()" disabled> 新增至最愛</button>
        
        <!-- 車站下拉選單 -->
        <div class="dropdown" id="stopDropdown"></div>
    </div>

    <div id="busList"><div class="loading">載入中...</div></div>
</div>

<script>
    // 1. 狀態管理
    let favorites = JSON.parse(localStorage.getItem('realBusFavorites')) || [];
    let showOnlyFav = false;
    let routeStopsCache = []; // 暫存當前路線嘅車站列表
    let selectedStop = null; // 暫存用戶揀選嘅車站

    // 2. 初始化
    window.onload = () => {
        if (favorites.length === 0) {
            favorites = [{ route: "1A", stopId: "66A93A407AB08486", stopName: "尖沙咀碼頭" }];
            saveToStorage();
        }
        fetchAllBusData();
        setupRouteListener();
    };

    // 3. 監聽路線輸入框 (防抖處理)
    function setupRouteListener() {
        const routeInput = document.getElementById('routeInput');
        const stopInput = document.getElementById('stopSearchInput');
        let timeout;

        routeInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            const route = e.target.value.trim().toUpperCase();
            
            // 清空狀態
            stopInput.value = '';
            stopInput.disabled = true;
            stopInput.placeholder = '請先輸入路線...';
            document.getElementById('stopDropdown').style.display = 'none';
            document.getElementById('addBtn').disabled = true;
            selectedStop = null;

            if (route.length === 0) return;

            // 延遲 500ms 觸發，避免頻繁請求
            timeout = setTimeout(async () => {
                stopInput.placeholder = '正在拉取車站列表...';
                try {
                    // 呼叫九巴路線車站 API
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}`);
                    const json = await res.json();
                    
                    // 官方 API 返回嘅是 outbound/inbound 兩個方向，我哋暫時合併 outbound
                    routeStopsCache = json.data?.outbound || [];
                    
                    if (routeStopsCache.length > 0) {
                        stopInput.disabled = false;
                        stopInput.placeholder = `搵到 ${routeStopsCache.length} 個站，請揀選...`;
                    } else {
                        stopInput.placeholder = '無此路線或無車站資料';
                    }
                } catch (err) {
                    stopInput.placeholder = '查詢失敗，請檢查路線號';
                }
            }, 500);
        });
    }

    // 4. 車站搜尋與下拉選單邏輯
    const stopSearchInput = document.getElementById('stopSearchInput');
    const dropdown = document.getElementById('stopDropdown');
    const addBtn = document.getElementById('addBtn');

    stopSearchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.trim();
        selectedStop = null;
        addBtn.disabled = true;
        
        if (keyword.length === 0 || routeStopsCache.length === 0) {
            dropdown.style.display = 'none';
            return;
        }

        // 本地過濾站名 (name_tc)
        const matches = routeStopsCache.filter(s => s.name_tc.includes(keyword)).slice(0, 10);
        
        if (matches.length > 0) {
            dropdown.innerHTML = matches.map(s => `
                <div class="dropdown-item" data-id="${s.stop}" data-name="${s.name_tc}">
                    ${s.name_tc}
                    <small>序號: ${s.seq}</small>
                </div>
            `).join('');
            dropdown.style.display = 'block';
        } else {
            dropdown.innerHTML = '<div class="dropdown-item">無相符車站</div>';
            dropdown.style.display = 'block';
        }
    });

    // 點擊下拉選單項目
    dropdown.addEventListener('click', (e) => {
        const item = e.target.closest('.dropdown-item');
        if (item && item.dataset.id) {
            selectedStop = { id: item.dataset.id, name: item.dataset.name };
            stopSearchInput.value = item.dataset.name;
            dropdown.style.display = 'none';
            addBtn.disabled = false; // 允許新增
        }
    });

    // 點擊其他地方關閉下拉選單
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.add-form')) dropdown.style.display = 'none';
    });

    // 5. 核心：並行獲取所有最愛路線的真實 ETA
    async function fetchAllBusData() {
        const listContainer = document.getElementById('busList');
        if (favorites.length === 0) {
            list
