<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巴士到站預報</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuedraggable@4.1.0/dist/vuedraggable.umd.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --accent: #007aff;
      --border: #e5e5ea;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    .header {
      margin-bottom: 16px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      box-sizing: border-box;
    }
    .bus-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bus-card {
      background: var(--card-bg);
      padding: 14px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      cursor: grab;
      user-select: none;
    }
    .bus-card:active {
      cursor: grabbing;
    }
    .bus-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .route-no {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent);
      min-width: 50px;
    }
    .details {
      display: flex;
      flex-direction: column;
    }
    .destination {
      font-weight: 600;
      font-size: 15px;
    }
    .stop-name {
      font-size: 12px;
      color: #8e8e93;
    }
    .eta {
      font-size: 18px;
      font-weight: bold;
      color: #34c759;
    }
    .ghost {
      opacity: 0.4;
    }
  </style>
</head>
<body>

<div id="app">
  <div class="header">
    <input 
      type="text" 
      v-model="searchQuery" 
      placeholder="搜尋路線或車站..." 
      class="search-input"
    />
  </div>

  <div v-if="searchQuery" class="bus-list">
    <div v-for="item in filteredRoutes" :key="item.id" class="bus-card">
      <div class="bus-info">
        <div class="route-no">{{ item.route }}</div>
        <div class="details">
          <div class="destination">往 {{ item.destination }}</div>
          <div class="stop-name">{{ item.stop }}</div>
        </div>
      </div>
      <div class="eta">{{ item.eta }} 分鐘</div>
    </div>
  </div>

  <draggable 
    v-else 
    v-model="routes" 
    item-key="id" 
    animation="200"
    ghost-class="ghost"
    class="bus-list"
  >
    <template #item="{ element }">
      <div class="bus-card">
        <div class="bus-info">
          <div class="route-no">{{ element.route }}</div>
          <div class="details">
            <div class="destination">往 {{ element.destination }}</div>
            <div class="stop-name">{{ element.stop }}</div>
          </div>
        </div>
        <div class="eta">{{ element.eta }} 分鐘</div>
      </div>
    </template>
  </draggable>
</div>

<script>
  const { createApp, ref, computed } = Vue;

  createApp({
    components: {
      draggable: window.vuedraggable
    },
    setup() {
      const searchQuery = ref('');
      
      // 模擬到站資料 (可替換為政府/巴士公司 API)
      const routes = ref([
        { id: 1, route: '1A', destination: '中環', stop: '尖沙咀碼頭', eta: 3 },
        { id: 2, route: '101', destination: '觀塘', stop: '紅磡海底隧道', eta: 8 },
        { id: 3, route: '960', destination: '屯門', stop: '灣仔會展', eta: 12 },
        { id: 4, route: '290A', destination: '荃灣', stop: '將軍澳站', eta: 2 }
      ]);

      const filteredRoutes = computed(() => {
        const query = searchQuery.value.toLowerCase();
        return routes.value.filter(item => 
          item.route.toLowerCase().includes(query) ||
          item.destination.includes(query) ||
          item.stop.includes(query)
        );
      });

      return {
        searchQuery,
        routes,
        filteredRoutes
      };
    }
  }).mount('#app');
</script>

</body>
</html>
