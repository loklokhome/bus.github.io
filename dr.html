<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>默書發聲程式 v12 修復版</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;}
body{max-width:920px;margin:16px auto;padding:16px;background:#f7f7f7;}
h2{margin-top:0}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.ctrl>div{background:#fff;padding:8px;border-radius:6px}
textarea{width:100%;height:260px;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:6px;margin-bottom:12px}
button{padding:9px 14px;font-size:16px;border:none;border-radius:6px;cursor:pointer;background:#2563eb;color:white;margin:4px}
#stop{background:#dc2626}
#pause{background:#f59e0b}
#ocrBtn{background:#059669}
#info{padding:8px;background:#eef;border-radius:6px;margin:8px 0}
.line-highlight{background:#fffd98}
</style>
</head>
<body>
<h2>默書發聲程式 v12｜每行重複+標點朗讀+暫停+OCR</h2>
<div class="ctrl">
<div>
<label>每行重複次數</label>
<input type="number" id="repeatCount" value="2" min="1">
</div>
<div>
<label>每行間隔(秒)</label>
<input type="number" id="lineGap" value="2" min="0.5" step="0.1">
</div>
<div>
<label>語速 0.1~10</label>
<input type="number" id="rate" value="1" min="0.1" max="10" step="0.1">
</div>
</div>
<div>
<input type="file" id="imgUpload" accept="image/*">
<button id="ocrBtn">OCR圖片辨識</button>
<button onclick="saveText()">儲存文字</button>
<button onclick="loadText()">讀取已儲存</button>
</div>
<textarea id="txtInput" placeholder="貼上文字，每行一句">Hello.
This is a test.</textarea>
<div>
<button id="playBtn">開始朗讀</button>
<button id="pauseBtn">暫停 / 繼續</button>
<button id="stopBtn">停止</button>
</div>
<div id="info"></div>

<script>
let synth = window.speechSynthesis;
let isRunning = false;
let isPaused = false;

// 英文標點替換
function replacePunctuation(text){
  text = text.replace(/\./g, " full stop ");
  text = text.replace(/,/g, " comma ");
  text = text.replace(/\?/g, " question mark ");
  text = text.replace(/!/g, " exclamation mark ");
  return text;
}

async function startRead(){
  if(isRunning) return;
  isRunning = true;
  isPaused = false;
  synth.cancel();
  const rawTxt = document.getElementById('txtInput').value;
  const lines = rawTxt.split('\n').filter(x=>x.trim()!=='');
  const repeat = Number(document.getElementById('repeatCount').value);
  const gap = Number(document.getElementById('lineGap').value) * 1000;
  const spRate = Number(document.getElementById('rate').value);

  document.getElementById('info').textContent = `開始，共${lines.length}行`;

  for(let li=0; li<lines.length; li++){
    if(!isRunning) break;
    while(isPaused) await sleep(300);
    const oriLine = lines[li].trim();
    let speakTxt = oriLine;
    // 英文行替換標點
    if(/[a-zA-Z]/.test(oriLine)){
      speakTxt = replacePunctuation(oriLine);
    }
    // ========== 每行重複迴圈（重點，之前版本呢度唔見咗） ==========
    for(let rp=0; rp<repeat; rp++){
      if(!isRunning) break;
      while(isPaused) await sleep(300);
      const u = new SpeechSynthesisUtterance(speakTxt);
      u.rate = spRate;
      // 揀英文聲音
      if(/[a-zA-Z]/.test(oriLine)){
        const voices = synth.getVoices();
        const enVoice = voices.find(v=>v.lang.startsWith('en'));
        if(enVoice) u.voice = enVoice;
      }
      await speakPromise(u);
    }
    document.getElementById('info').textContent = `讀到第${li+1}行`;
    await sleep(gap);
  }
  document.getElementById('info').textContent = '全部讀完';
  isRunning = false;
}

function speakPromise(u){
  return new Promise(res=>{
    u.onend = res;
    synth.speak(u);
  })
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

// 暫停繼續
function togglePause(){
  if(!isRunning) return;
  isPaused = !isPaused;
  if(isPaused){
    synth.pause();
    document.getElementById('info').textContent = "已暫停";
  }else{
    synth.resume();
    document.getElementById('info').textContent = "繼續";
  }
}

function stopRead(){
  isRunning = false;
  isPaused = false;
  synth.cancel();
  document.getElementById('info').textContent = "已停止";
}

// 本地儲存
function saveText(){
  const t = document.getElementById('txtInput').value;
  localStorage.setItem('memoVoiceText', t);
  document.getElementById('info').textContent = "已儲存文字";
}
function loadText(){
  const t = localStorage.getItem('memoVoiceText') || '';
  document.getElementById('txtInput').value = t;
  document.getElementById('info').textContent = "已載入文字";
}

// OCR 圖片辨識
document.getElementById('ocrBtn').onclick = async ()=>{
  const fileInput = document.getElementById('imgUpload');
  if(!fileInput.files[0]){
    document.getElementById('info').textContent = "請先揀圖片";
    return;
  }
  document.getElementById('info').textContent = "OCR辨識中，請稍候...";
  const result = await Tesseract.recognize(fileInput.files[0],'eng+chi-tra');
  document.getElementById('txtInput').value = result.data.text;
  document.getElementById('info').textContent = "OCR完成";
}

document.getElementById('playBtn').onclick = startRead;
document.getElementById('pauseBtn').onclick = togglePause;
document.getElementById('stopBtn').onclick = stopRead;

synth.onvoiceschanged = ()=>synth.getVoices();
</script>
</body>
</html>
