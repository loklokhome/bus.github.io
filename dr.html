<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>默書發聲練習 v12</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;}
body{max-width:900px;margin:12px auto;padding:12px;}
.control-group{border:1px solid #ccc;padding:12px;margin:8px 0;border-radius:8px;}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0;align-items:center;}
textarea{width:100%;height:260px;padding:10px;font-size:18px;white-space:pre-wrap;}
button{padding:8px 14px;font-size:16px;cursor:pointer;}
.info{color:#555;font-size:14px;}
.version{font-weight:bold;font-size:18px;color:#2266aa;}
</style>
</head>
<body>
<div class="version">默書發聲練習 v12</div>
<div class="info">功能：OCR圖片辨識｜英文句號讀full stop｜雙語標點朗讀｜暫停/繼續｜逐段朗讀｜每行重複｜重複間隔｜行尾停頓｜高亮｜鎖定文字框｜本地儲存</div>

<div class="control-group">
<div class="row">
<label>每行重複次數：<input id="repeatPerLine" type="number" value="2" min="1"></label>
<label>✅ 每行重複之間間隔(秒)：<input id="repeatGap" type="number" value="0.8" min="0" step="0.1"></label>
<label>讀完一行後停頓(秒)：<input id="lineGap" type="number" value="1.5" min="0" step="0.1"></label>
<label>整體輪數：<input id="totalRound" type="number" value="1" min="1"></label>
</div>
<div class="row">
<label>語音選擇：<select id="voiceSelect"></select></label>
<label>語速：<input id="rate" type="range" min="0.5" max="1.8" step="0.1" value="1"> <span id="rateVal">1.0</span></label>
</div>
<div class="row">
<button id="ocrBtn">上載圖片OCR辨識</button>
<button id="saveBtn">儲存文字</button>
<button id="loadBtn">載入文字</button>
<button id="startBtn">開始朗讀</button>
<button id="pauseBtn">暫停</button>
<button id="resumeBtn">繼續</button>
<button id="stopBtn">停止</button>
</div>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>

<textarea id="textArea" placeholder="測試例子：
Apple, apple.
Banana! Banana?
蘋果，蘋果。
香蕉！香蕉？"></textarea>

<script>
// 雙語標點對照，英文句號 . 改為 full stop
const punctData = {
    "，":{cn:"逗號", en:"comma"},
    "。":{cn:"句號", en:"full stop"},
    "！":{cn:"感嘆號", en:"exclamation mark"},
    "？":{cn:"問號", en:"question mark"},
    "：":{cn:"冒號", en:"colon"},
    "；":{cn:"分號", en:"semicolon"},
    "、":{cn:"頓號", en:"enumeration comma"},
    "「":{cn:"左引號", en:"left quotation mark"},
    "」":{cn:"右引號", en:"right quotation mark"},
    "（":{cn:"左括號", en:"left parenthesis"},
    "）":{cn:"右括號", en:"right parenthesis"},
    ".":{cn:"句號", en:"full stop"},
    ",":{cn:"逗號", en:"comma"},
    "!":{cn:"感嘆號", en:"exclamation mark"},
    "?":{cn:"問號", en:"question mark"}
};
const punctKeys = Object.keys(punctData);

let synth = window.speechSynthesis;
let voiceList = [];
let isReading = false;
let isPaused = false;
let currentLineIndex = 0;
let currentRepeatCount = 0;
let currentRound = 0;
let segIndex = 0;
let currentSegments = [];
let lines = [];
let voiceUsed = null;
let rateUsed = 1;
let isEngVoice = false;

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function loadVoices(){
    voiceList = synth.getVoices();
    const sel = $("#voiceSelect");
    sel.innerHTML = "";
    voiceList.forEach((v,i)=>{
        const opt = document.createElement("option");
        opt.textContent = v.name + " ("+v.lang+")";
        opt.value = i;
        sel.appendChild(opt);
    })
    let engIdx = voiceList.findIndex(v=>v.lang.startsWith("en"));
    if(engIdx >=0) sel.value = engIdx;
}
synth.onvoiceschanged = loadVoices;
loadVoices();

$("#rate").oninput = ()=>$("#rateVal").textContent = $("#rate").value;

// OCR
$("#ocrBtn").onclick = ()=>$("#fileInput").click();
$("#fileInput").onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file)return;
    alert("OCR處理中，大圖會耐少少，請等...");
    const tesseract = await import('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    const res = await tesseract.recognize(file, 'chi_tra+eng');
    $("#textArea").value = res.data.text;
    alert("OCR完成，保留標點同換行");
}

// 本地儲存載入
$("#saveBtn").onclick = ()=>{
    localStorage.setItem("dictationText", $("#textArea").value);
    alert("已儲存到瀏覽器本地");
}
$("#loadBtn").onclick = ()=>{
    const txt = localStorage.getItem("dictationText");
    if(txt){$("#textArea").value = txt;alert("載入成功");}
    else alert("冇已儲存資料");
}

$("#startBtn").onclick = startRead;
$("#pauseBtn").onclick = pauseRead;
$("#resumeBtn").onclick = resumeRead;
$("#stopBtn").onclick = stopRead;

// 拆分行文字，自動判斷用英文/中文標點讀法
function splitLineToSegments(lineText, isEnglishVoice){
    let segments = [];
    let buf = "";
    for(let char of lineText){
        if(punctKeys.includes(char)){
            if(buf.trim() !== ""){
                segments.push(buf.trim());
                buf = "";
            }
            const p = punctData[char];
            segments.push(isEnglishVoice ? p.en : p.cn);
        }else{
            buf += char;
        }
    }
    if(buf.trim() !== ""){
        segments.push(buf.trim());
    }
    return segments;
}

async function speakCurrentSegments(){
    while(segIndex < currentSegments.length && isReading){
        if(isPaused){
            await waitResume();
        }
        if(!isReading) return;
        const seg = currentSegments[segIndex];
        const utter = new SpeechSynthesisUtterance(seg);
        utter.voice = voiceUsed;
        utter.rate = rateUsed;
        await speakPromise(utter);
        segIndex++;
    }
}

function waitResume(){
    return new Promise(resolve=>{
        const waitLoop = ()=>{
            if(!isPaused || !isReading){
                resolve();
                return;
            }
            setTimeout(waitLoop, 100);
        }
        waitLoop();
    })
}

async function startRead(){
    if(isReading) return;
    const rawText = $("#textArea").value;
    lines = rawText.split(/\r?\n/);
    lines = lines.filter(x=>x.trim()!== "");
    if(lines.length===0){alert("請輸入文字");return;}

    isReading = true;
    isPaused = false;
    $("#textArea").disabled = true;
    currentRound = 0;
    const voiceIndex = $("#voiceSelect").value;
    voiceUsed = voiceList[voiceIndex];
    isEngVoice = voiceUsed.lang.startsWith("en");
    rateUsed = Number($("#rate").value);

    while(currentRound < Number($("#totalRound").value) && isReading){
        currentRound++;
        currentLineIndex = 0;
        while(currentLineIndex < lines.length && isReading){
            const line = lines[currentLineIndex];
            currentSegments = splitLineToSegments(line, isEngVoice);
            segIndex = 0;
            const repeatTimes = Number($("#repeatPerLine").value);
            const repeatGap = Number($("#repeatGap").value)*1000;
            const lineGap = Number($("#lineGap").value)*1000;
            currentRepeatCount = 0;

            while(currentRepeatCount < repeatTimes && isReading){
                if(isPaused) await waitResume();
                if(!isReading) return;
                // 高亮當前行
                $("#textArea").focus();
                const fullTxt = $("#textArea").value;
                let pos = 0;
                for(let i=0;i<currentLineIndex;i++) pos += lines[i].length +1;
                $("#textArea").setSelectionRange(pos, pos+line.length);

                await speakCurrentSegments();

                currentRepeatCount++;
                if(currentRepeatCount < repeatTimes && isReading){
                    await sleep(repeatGap);
                }
            }
            currentLineIndex++;
            if(isReading) await sleep(lineGap);
        }
    }
    stopRead();
}

function pauseRead(){
    if(!isReading) return;
    isPaused = true;
    synth.pause();
}
function resumeRead(){
    if(!isReading) return;
    isPaused = false;
    synth.resume();
}

function speakPromise(utter){
    return new Promise(resolve=>{
        utter.onend = resolve;
        utter.onerror = resolve;
        synth.speak(utter);
    })
}
function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

function stopRead(){
    isReading = false;
    isPaused = false;
    synth.cancel();
    $("#textArea").disabled = false;
    $("#textArea").setSelectionRange(0,0);
}
</script>
</body>
</html>
