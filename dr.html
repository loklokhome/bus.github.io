<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>默書發聲程式 v12.5</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{max-width:920px;margin:16px auto;padding:16px;background:#f8f8f8}
h2{margin:0 0 12px}
.panel{background:#fff;padding:14px;border-radius:10px;margin-bottom:12px;box-shadow:0 1px 4px #0002}
textarea{width:100%;height:220px;padding:10px;font-size:16px;white-space:pre-wrap}
.ctrl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
input,select,button{padding:8px;font-size:15px}
button{cursor:pointer}
.line-item{display:flex;gap:8px;align-items:center;margin:6px 0;border:1px solid #ddd;padding:8px;border-radius:6px}
.line-text{flex:1}
.line-input{width:60px}
#log{height:100px;overflow:auto;background:#f4f4f4;padding:8px;font-size:13px}
</style>
</head>
<body>
<div class="panel">
<h2>默書發聲程式 v12.5</h2>
<div class="ctrl-row">
<button id="loadOcr">上載圖片OCR辨識文字</button>
<input type="file" id="imgFile" accept="image/*" hidden>
<button id="splitBtn">拆分成行設定</button>
<button id="saveText">儲存文字</button>
<button id="clearStorage">清除儲存</button>
</div>
<textarea id="mainText" placeholder="輸入文字，或上載圖片提取文字，按【拆分成行設定】"></textarea>
</div>

<div class="panel">
<div class="ctrl-row">
<label>選擇語音：</label>
<select id="voiceSelect"></select>
<label>整體語速：<input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1"> <span id="rateVal">1</span></label>
</div>
<div id="lineList"></div>
<div class="ctrl-row">
<button id="startBtn">開始朗讀</button>
<button id="pauseBtn">暫停 / 繼續</button>
<button id="stopBtn">停止</button>
</div>
<div id="log"></div>
</div>

<script>
// 全域變數
let voices = [];
let utterQueue = [];
let isPlaying = false;
let isPaused = false;
let currentUtter = null;
let lineDataList = [];
const storageKey = "memovoice_v125";

// 載入已儲存文字
window.onload = ()=>{
  const saved = localStorage.getItem(storageKey);
  if(saved) document.getElementById("mainText").value = saved;
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

// 載入語音清單
function loadVoices(){
  voices = speechSynthesis.getVoices();
  const sel = document.getElementById("voiceSelect");
  sel.innerHTML = "";
  voices.forEach((v,i)=>{
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = v.name + " ("+v.lang+")";
    sel.appendChild(opt);
  })
}

// 語速顯示
document.getElementById("rateRange").oninput = e=>{
  document.getElementById("rateVal").textContent = e.target.value;
}

// OCR上載
document.getElementById("loadOcr").onclick = ()=>document.getElementById("imgFile").click();
document.getElementById("imgFile").onchange = async e=>{
  const file = e.target.files[0];
  if(!file)return;
  const log = document.getElementById("log");
  log.innerText = "OCR處理中，請稍候...";
  const reader = new FileReader();
  reader.onload = async ev=>{
    const img = new Image();
    img.src = ev.target.result;
    await new Promise(r=>img.onload=r);
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = img.width;canvas.height=img.height;
    ctx.drawImage(img,0,0);
    const res = await Tesseract.recognize(canvas,"chi_tra+eng",{logger:m=>log.innerText=m.status});
    document.getElementById("mainText").value = res.data.text;
    log.innerText = "OCR完成！";
  }
  reader.readAsDataURL(file);
}

// 儲存文字
document.getElementById("saveText").onclick = ()=>{
  localStorage.setItem(storageKey,document.getElementById("mainText").value);
  document.getElementById("log").innerText = "已儲存";
}
document.getElementById("clearStorage").onclick = ()=>{
  localStorage.removeItem(storageKey);
  document.getElementById("mainText").value="";
  document.getElementById("log").innerText = "已清除儲存";
}

// 拆分行，建立每行設定：重複次數、重複間隔
document.getElementById("splitBtn").onclick = ()=>{
  const txt = document.getElementById("mainText").value;
  const lines = txt.split(/\r?\n/);
  const container = document.getElementById("lineList");
  container.innerHTML = "";
  lineDataList = [];
  lines.forEach((line,idx)=>{
    if(line.trim()==="")return;
    const d = {text:line,repeat:1,interval:1.5};
    lineDataList.push(d);
    const div = document.createElement("div");
    div.className = "line-item";
    div.innerHTML = `
    <span>${idx+1}</span>
    <div class="line-text">${escapeHtml(line)}</div>
    <label>重複<input class="line-input rep" type="number" min="1" value="${d.repeat}"></label>
    <label>間隔(秒)<input class="line-input intv" type="number" min="0.2" step="0.1" value="${d.interval}"></label>
    `
    container.appendChild(div);
  })
  // 監聽輸入，更新參數
  container.querySelectorAll(".rep").forEach((inp,i)=>{
    inp.oninput = ()=>lineDataList[i].repeat = Number(inp.value||1);
  })
  container.querySelectorAll(".intv").forEach((inp,i)=>{
    inp.oninput = ()=>lineDataList[i].interval = Number(inp.value||1);
  })
  document.getElementById("log").innerText = "分行完成，可以設定每行重複同間隔";
}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

// 【重點】根據揀選嘅語音語言，自動轉換標點讀法
function replacePunctByLang(text, voiceLang){
  // 判斷是否英文語音
  const isEnglish = voiceLang.startsWith("en");
  if(isEnglish){
    // 英文語音：. → full stop
    return text.replace(/\./g," full stop ");
  }else{
    // 中文（粵語/國語）語音：. → 句號
    return text.replace(/\./g," 句號 ");
  }
}

// 開始朗讀
document.getElementById("startBtn").onclick = async ()=>{
  if(lineDataList.length===0){
    document.getElementById("log").innerText = "請先按【拆分成行設定】";
    return;
  }
  speechSynthesis.cancel();
  isPlaying=true;isPaused=false;
  const voiceIdx = Number(document.getElementById("voiceSelect").value);
  const voice = voices[voiceIdx];
  const rate = Number(document.getElementById("rateRange").value);
  const log = document.getElementById("log");
  log.innerText="開始朗讀";

  for(const line of lineDataList){
    if(!isPlaying)break;
    // 傳入當前語音嘅語言代碼，決定標點讀法
    const speakTxt = replacePunctByLang(line.text, voice.lang);
    // 本行重複指定次數
    for(let r=0;r<line.repeat;r++){
      if(!isPlaying)break;
      await speakAndWait(speakTxt,voice,rate);
      if(!isPlaying)break;
      await sleep(line.interval*1000);
    }
  }
  log.innerText="全部朗讀完畢";
  isPlaying=false;
}

function speakAndWait(text,voice,rate){
  return new Promise(res=>{
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice;
    u.rate = rate;
    currentUtter = u;
    u.onend = ()=>res();
    u.onerror = ()=>res();
    speechSynthesis.speak(u);
  })
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

// 暫停 / 繼續
document.getElementById("pauseBtn").onclick = ()=>{
  if(!isPlaying)return;
  if(!isPaused){
    speechSynthesis.pause();
    isPaused=true;
    document.getElementById("log").innerText="已暫停";
  }else{
    speechSynthesis.resume();
    isPaused=false;
    document.getElementById("log").innerText="繼續朗讀";
  }
}
// 停止
document.getElementById("stopBtn").onclick = ()=>{
  speechSynthesis.cancel();
  isPlaying=false;isPaused=false;
  document.getElementById("log").innerText="已停止";
}
</script>
<!-- OCR庫 -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
</body>
</html>
