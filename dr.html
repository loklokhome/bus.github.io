<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>默書發聲程式 v12.3</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;}
body{max-width:960px;margin:16px auto;padding:16px;background:#f7f7f7;}
h2{margin-top:0}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.ctrl>div{background:#fff;padding:8px;border-radius:6px}
.voiceBox{background:#fff;padding:8px;border-radius:6px;margin-bottom:12px}
select{width:100%;padding:6px;font-size:16px}
textarea{width:100%;height:260px;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:6px;margin-bottom:12px}
button{padding:9px 14px;font-size:16px;border:none;border-radius:6px;cursor:pointer;background:#2563eb;color:white;margin:4px}
#stopBtn{background:#dc2626}
#pauseBtn{background:#f59e0b}
#ocrBtn{background:#059669}
#info{padding:8px;background:#eef;border-radius:6px;margin:8px 0}
</style>
</head>
<body>
<h2>默書發聲程式 v12.3｜中英都讀標點</h2>

<div class="voiceBox">
<label>選擇朗讀語音：</label>
<select id="voiceSelect"></select>
</div>

<div class="ctrl">
<div>
<label>每行重複次數</label>
<input type="number" id="repeatCount" value="2" min="1">
</div>
<div>
<label>重複間隔(秒)【同一行每次之間】</label>
<input type="number" id="repeatGap" value="1" min="0.2" step="0.1">
</div>
<div>
<label>每行間隔(秒)【行與行之間】</label>
<input type="number" id="lineGap" value="2" min="0.5" step="0.1">
</div>
<div>
<label>語速 0.1~10</label>
<input type="number" id="rate" value="1" min="0.1" max="10" step="0.1">
</div>
</div>

<div>
<input type="file" id="imgUpload" accept="image/*">
<button id="ocrBtn">OCR圖片辨識</button>
<button onclick="saveText()">儲存文字</button>
<button onclick="loadText()">讀取已儲存</button>
</div>
<textarea id="txtInput" placeholder="貼上文字，每行一句">Hello.
這是測試，中文。
你好！對嗎？</textarea>
<div>
<button id="playBtn">開始朗讀</button>
<button id="pauseBtn">暫停 / 繼續</button>
<button id="stopBtn">停止</button>
</div>
<div id="info"></div>

<script>
let synth = window.speechSynthesis;
let isRunning = false;
let isPaused = false;
let voices = [];
const voiceSelect = document.getElementById('voiceSelect');

// 載入所有可用語音
function populateVoiceList() {
  voices = synth.getVoices();
  voiceSelect.innerHTML = '';
  for(let i=0; i<voices.length; i++){
    const option = document.createElement('option');
    option.textContent = `${voices[i].name} (${voices[i].lang})`;
    option.dataset.name = voices[i].name;
    voiceSelect.appendChild(option);
  }
}
populateVoiceList();
synth.onvoiceschanged = populateVoiceList;

// 標點對照表
const punctMap = {
  ".":{cn:"句號", en:"full stop"},
  ",":{cn:"逗號", en:"comma"},
  "?":{cn:"問號", en:"question mark"},
  "!":{cn:"感嘆號", en:"exclamation mark"},
  "。":{cn:"句號", en:"full stop"},
  "，":{cn:"逗號", en:"comma"},
  "？":{cn:"問號", en:"question mark"},
  "！":{cn:"感嘆號", en:"exclamation mark"}
};

// 處理標點：判斷係咪英文語音，揀對應讀音
function replacePunctuation(text, isEnglishVoice){
  for(const ch in punctMap){
    const val = punctMap[ch];
    const readWord = isEnglishVoice ? val.en : val.cn;
    text = text.replace(new RegExp(ch,"g"), ` ${readWord} `);
  }
  return text;
}

async function startRead(){
  if(isRunning) return;
  isRunning = true;
  isPaused = false;
  synth.cancel();
  const rawTxt = document.getElementById('txtInput').value;
  const lines = rawTxt.split('\n').filter(x=>x.trim()!=='');
  const repeat = Number(document.getElementById('repeatCount').value);
  const repeatGap = Number(document.getElementById('repeatGap').value) * 1000;
  const lineGap = Number(document.getElementById('lineGap').value) * 1000;
  const spRate = Number(document.getElementById('rate').value);

  const selectedVoiceName = voiceSelect.selectedOptions[0].dataset.name;
  const selectedVoice = voices.find(v=>v.name === selectedVoiceName);
  // 判斷當前揀嘅聲音係咪英文
  const isEngVoice = selectedVoice && selectedVoice.lang.startsWith("en");

  document.getElementById('info').textContent = `開始，共${lines.length}行`;

  for(let li=0; li<lines.length; li++){
    if(!isRunning) break;
    while(isPaused) await sleep(300);
    const oriLine = lines[li].trim();
    // 無論中文定英文，全部做標點替換
    const speakTxt = replacePunctuation(oriLine, isEngVoice);

    // 同一行重複讀
    for(let rp=0; rp<repeat; rp++){
      if(!isRunning) break;
      while(isPaused) await sleep(300);
      const u = new SpeechSynthesisUtterance(speakTxt);
      u.rate = spRate;
      if(selectedVoice) u.voice = selectedVoice;
      await speakPromise(u);
      if(rp !== repeat - 1){
        await sleep(repeatGap);
      }
    }
    document.getElementById('info').textContent = `讀到第${li+1}行`;
    await sleep(lineGap);
  }
  document.getElementById('info').textContent = '全部讀完';
  isRunning = false;
}

function speakPromise(u){
  return new Promise(res=>{
    u.onend = res;
    synth.speak(u);
  })
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

// 暫停繼續
function togglePause(){
  if(!isRunning) return;
  isPaused = !isPaused;
  if(isPaused){
    synth.pause();
    document.getElementById('info').textContent = "已暫停";
  }else{
    synth.resume();
    document.getElementById('info').textContent = "繼續";
  }
}

function stopRead(){
  isRunning = false;
  isPaused = false;
  synth.cancel();
  document.getElementById('info').textContent = "已停止";
}

// 本地儲存
function saveText(){
  const t = document.getElementById('txtInput').value;
  localStorage.setItem('memoVoiceText', t);
  document.getElementById('info').textContent = "已儲存文字";
}
function loadText(){
  const t = localStorage.getItem('memoVoiceText') || '';
  document.getElementById('txtInput').value = t;
  document.getElementById('info').textContent = "已載入文字";
}

// OCR 圖片辨識
document.getElementById('ocrBtn').onclick = async ()=>{
  const fileInput = document.getElementById('imgUpload');
  if(!fileInput.files[0]){
    document.getElementById('info').textContent = "請先揀圖片";
    return;
  }
  document.getElementById('info').textContent = "OCR辨識中，請稍候...";
  const result = await Tesseract.recognize(fileInput.files[0],'eng+chi-tra');
  document.getElementById('txtInput').value = result.data.text;
  document.getElementById('info').textContent = "OCR完成";
}

document.getElementById('playBtn').onclick = startRead;
document.getElementById('pauseBtn').onclick = togglePause;
document.getElementById('stopBtn').onclick = stopRead;
</script>
</body>
</html>
