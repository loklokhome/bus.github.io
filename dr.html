<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>默書發聲程式 v12.7（普通話修復版）</title>
<style>
body { font-family: sans-serif; padding: 16px; max-width: 900px; margin: 0 auto; }
textarea { width: 100%; height: 140px; }
button { margin: 4px; padding: 6px 12px; }
.line-item { margin: 4px 0; }
.info { color:#666; font-size:14px }
</style>
</head>
<body>
<h2>默書發聲程式 v12.7（普通話修復版）</h2>

<div>
  <label>文字輸入：</label>
  <textarea id="inputText"></textarea>
</div>

<div style="margin: 8px 0;">
  <button onclick="splitLines()">拆分行</button>
  <button onclick="saveText()">儲存文字</button>
  <button onclick="loadText()">讀取文字</button>
</div>

<div id="lineContainer"></div>

<div style="margin: 12px 0;">
  <label>每行重複次數：</label>
  <input type="number" id="repeatCount" value="2" min="1">
</div>
<div style="margin: 12px 0;">
  <label>重複間隔 (秒)：</label>
  <input type="number" id="repeatGap" value="1.5" min="0.1" step="0.1">
</div>

<div style="margin: 12px 0;">
  <label>揀語音：</label>
  <select id="voiceSelect">
    <option value="cantonese">粵語</option>
    <option value="mandarin">普通話</option>
    <option value="english">英文</option>
  </select>
</div>
<div class="info">備註：首次開啟最好等幾秒，等瀏覽載齊語音包先按開始</div>

<div style="margin: 12px 0;">
  <button onclick="startSpeak()">開始朗讀</button>
  <button onclick="pauseSpeak()">暫停 / 繼續</button>
  <button onclick="stopSpeak()">停止</button>
</div>

<script>
let lineList = [];
let currentIndex = 0;
let repeatIdx = 0;
let globalTimer = null;
let isPaused = false;
let currentUtter = null;
let voiceReady = false;

function splitLines(){
  const raw = document.getElementById('inputText').value;
  lineList = raw.split(/\r?\n/).filter(x=>x.trim()!=='');
  renderLines();
}

function renderLines(){
  const container = document.getElementById('lineContainer');
  container.innerHTML = '';
  lineList.forEach((txt,i)=>{
    const div = document.createElement('div');
    div.className = 'line-item';
    div.innerText = `${i+1}. ${txt}`;
    container.appendChild(div);
  })
}

function saveText(){
  localStorage.setItem('memoText', document.getElementById('inputText').value);
  alert('已儲存');
}

function loadText(){
  const t = localStorage.getItem('memoText');
  if(t){
    document.getElementById('inputText').value = t;
    splitLines();
    alert('已讀取');
  } else {
    alert('冇已儲存嘅文字');
  }
}

function replacePunctuation(text, voiceType){
  if (voiceType === 'english'){
    return text.replace(/\./g, ' full stop ');
  } else {
    return text
      .replace(/，/g, ' 逗號 ')
      .replace(/。/g, ' 句號 ')
      .replace(/？/g, ' 問號 ')
      .replace(/！/g, ' 感嘆號 ');
  }
}

function getVoice(voiceType){
  const voices = speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return null;

  if (voiceType === 'cantonese'){
    return voices.find(v => v.lang === 'zh-HK' || v.lang === 'yue-HK') || voices[0];
  } else if (voiceType === 'mandarin'){
    // 放鬆普通話匹配條件，兼容唔同瀏覽器命名
    return voices.find(v => {
      const l = v.lang.toLowerCase();
      return l === 'zh-cn' || l === 'zh' || l.startsWith('zh');
    }) || voices[0];
  } else {
    return voices.find(v => v.lang.startsWith('en')) || voices[0];
  }
}

function speakOne(){
  if (currentIndex >= lineList.length) {
    clearTimeout(globalTimer);
    return;
  }
  const voiceType = document.getElementById('voiceSelect').value;
  const repeatCount = Number(document.getElementById('repeatCount').value);
  const gapSec = Number(document.getElementById('repeatGap').value);

  let srcText = lineList[currentIndex];
  const speakText = replacePunctuation(srcText, voiceType);
  const voiceObj = getVoice(voiceType);

  currentUtter = new SpeechSynthesisUtterance(speakText);
  if (voiceObj) {
    currentUtter.voice = voiceObj;
  }

  speechSynthesis.speak(currentUtter);

  currentUtter.onend = () => {
    repeatIdx += 1;
    if (repeatIdx < repeatCount) {
      globalTimer = setTimeout(speakOne, gapSec * 1000);
    } else {
      repeatIdx = 0;
      currentIndex += 1;
      globalTimer = setTimeout(speakOne, gapSec * 1000);
    }
  }
}

function startSpeak(){
  stopSpeak();
  currentIndex = 0;
  repeatIdx = 0;
  isPaused = false;
  speakOne();
}

function pauseSpeak(){
  if (isPaused){
    speechSynthesis.resume();
    isPaused = false;
  } else {
    speechSynthesis.pause();
    isPaused = true;
  }
}

function stopSpeak(){
  clearTimeout(globalTimer);
  speechSynthesis.cancel();
  currentIndex = 0;
  repeatIdx = 0;
  isPaused = false;
}

// 等待語音載完成
speechSynthesis.onvoiceschanged = () => {
  voiceReady = true;
};
</script>
</body>
</html>
