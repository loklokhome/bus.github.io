<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時股票報價</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 30px auto; padding: 0 15px; background: #f8f9fa; }
    h2 { text-align: center; color: #212529; }
    .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
    input { flex: 1; padding: 10px; font-size: 14px; border: 1px solid #ced4da; border-radius: 6px; }
    button { padding: 10px 15px; font-size: 14px; background: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0b5ed7; }
    .tip { font-size: 12px; color: #6c757d; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #dee2e6; }
    th { background: #e9ecef; color: #495057; font-size: 14px; }
    .price { font-weight: bold; font-family: monospace; font-size: 15px; color: #198754; }
    .loading { color: #888; font-style: italic; font-weight: normal; }
    .error { color: #dc3545; font-weight: normal; font-size: 13px; }
    .del-btn { background: #dc3545; padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; color: white; cursor: pointer; }
    .del-btn:hover { background: #bb2d3b; }
    .status-bar { display: flex; justify-content: space-between; font-size: 12px; color: #6c757d; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>📈 即時股票報價</h2>

  <div class="input-group">
    <input type="text" id="symbolInput" placeholder="輸入代號 (例如: 0700.HK, AAPL)">
    <button onclick="addStock()">新增</button>
  </div>
  <div class="tip">提示：港股例 0700.HK 或直接入 700、美股 AAPL</div>

  <table>
    <thead>
      <tr>
        <th>股票代號/名稱</th>
        <th>即時價錢</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="stockTable"></tbody>
  </table>

  <div class="status-bar">
    <span id="updateTime">初始化中...</span>
    <a href="#" onclick="fetchAllPrices(); return false;" style="color:#0d6efd;">手動刷新</a>
  </div>

  <script>
    let stockList = JSON.parse(localStorage.getItem('autoStocks')) || ['0700.HK', '09988.HK', 'AAPL'];
    let stockData = {};

    function saveList() {
      localStorage.setItem('autoStocks', JSON.stringify(stockList));
    }

    async function fetchPrice(symbol) {
      const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m`;
      
      // 使用 Google Apps Script CORS 代理，穩定度大幅提升
      const proxyUrl = `https://script.google.com/macros/s/AKfycbw7sA56AYA3x4S3k42l2a24A45p1a23/exec?url=${encodeURIComponent(targetUrl)}`;
      
      // 備用代理：以防主代理繁忙
      const fallbackUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

      try {
        let response = await fetch(proxyUrl).catch(() => fetch(fallbackUrl));
        if (!response.ok) throw new Error('網絡連線異常');
        
        const data = await response.json();
        const result = data.chart.result[0];

        const price = result.meta.regularMarketPrice;
        const currency = result.meta.currency;
        const name = result.meta.shortName || result.meta.symbol;

        return { name, price: `${currency} $${price.toFixed(2)}`, isError: false };
      } catch (error) {
        console.error(`獲取 ${symbol} 失敗:`, error);
        return { name: symbol, price: '讀取失敗 (請刷新)', isError: true };
      }
    }

    async function fetchAllPrices() {
      document.getElementById('updateTime').innerText = '正在更新股價...';
      
      // 平行非同步處理所有股票，加快讀取速度
      const fetchPromises = stockList.map(async (symbol) => {
        stockData[symbol] = await fetchPrice(symbol);
        renderTable();
      });

      await Promise.all(fetchPromises);

      const now = new Date();
      document.getElementById('updateTime').innerText = `最後更新: ${now.toLocaleTimeString()}`;
    }

    function renderTable() {
      const tbody = document.getElementById('stockTable');
      tbody.innerHTML = '';

      stockList.forEach((symbol, index) => {
        const info = stockData[symbol] || { name: symbol, price: '讀取中...', isError: false };
        let priceClass = 'price';
        if (info.price === '讀取中...') priceClass = 'loading';
        if (info.isError) priceClass = 'error';

        tbody.innerHTML += `
          <tr>
            <td>
              <strong>${symbol}</strong><br>
              <small style="color:#6c757d">${info.name !== symbol ? info.name : ''}</small>
            </td>
            <td class="${priceClass}">${info.price}</td>
            <td><button class="del-btn" onclick="deleteStock(${index})">刪除</button></td>
          </tr>
        `;
      });
    }

    function addStock() {
      const input = document.getElementById('symbolInput');
      let symbol = input.value.trim().toUpperCase();

      if (!symbol) return;

      if (/^\d+$/.test(symbol)) {
        symbol = symbol.padStart(4, '0') + '.HK';
      }

      if (!stockList.includes(symbol)) {
        stockList.push(symbol);
        saveList();
        renderTable();
        fetchAllPrices();
      }

      input.value = '';
    }

    function deleteStock(index) {
      const symbol = stockList[index];
      stockList.splice(index, 1);
      delete stockData[symbol];
      saveList();
      renderTable();
    }

    renderTable();
    fetchAllPrices();
    setInterval(fetchAllPrices, 30000);
  </script>
<a href="#" onclick="fetchAllPrices(); return false;" style="display:block; width:fit-content; margin:0 auto; color:#fff; background:#0d6efd; padding:8px 20px; border-radius:6px; font-size:24px; text-decoration:none;">手動刷新</a>
</body>
</html>
