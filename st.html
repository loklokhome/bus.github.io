<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自動即時股票報價</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 30px auto; padding: 0 15px; background: #f8f9fa; }
    h2 { text-align: center; color: #212529; }
    .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
    input { flex: 1; padding: 10px; font-size: 14px; border: 1px solid #ced4da; border-radius: 6px; }
    button { padding: 10px 15px; font-size: 14px; background: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0b5ed7; }
    .tip { font-size: 12px; color: #6c757d; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #dee2e6; }
    th { background: #e9ecef; color: #495057; font-size: 14px; }
    .price { font-weight: bold; font-family: monospace; font-size: 15px; }
    .loading { color: #888; font-style: italic; }
    .del-btn { background: #dc3545; padding: 5px 10px; font-size: 12px; border-radius: 4px; }
    .del-btn:hover { background: #bb2d3b; }
    .status-bar { display: flex; justify-content: space-between; font-size: 12px; color: #6c757d; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>📈 即時股票報價</h2>

  <div class="input-group">
    <input type="text" id="symbolInput" placeholder="輸入代號 (例如: 0700.HK, AAPL, 2330.TW)">
    <button onclick="addStock()">新增</button>
  </div>
  <div class="tip">提示：港股加 `.HK`（例 0700.HK）、美股直接入代號（例 AAPL）、台股加 `.TW`</div>

  <table>
    <thead>
      <tr>
        <th>股票代號/名稱</th>
        <th>即時價錢</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="stockTable"></tbody>
  </table>

  <div class="status-bar">
    <span id="updateTime">尚未更新</span>
    <a href="#" onclick="fetchAllPrices(); return false;" style="color:#0d6efd;">手動刷新</a>
  </div>

  <script>
    // 預設追蹤清單
    let stockList = JSON.parse(localStorage.getItem('autoStocks')) || ['0700.HK', '09988.HK', 'AAPL'];
    let stockData = {}; // 暫存價格數據

    function saveList() {
      localStorage.setItem('autoStocks', JSON.stringify(stockList));
    }

    // 利用 Yahoo Finance API 抓取價格數據
    async function fetchPrice(symbol) {
      try {
        // 使用 query2.finance.yahoo.com 以及 CORS Proxy
        const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        
        const response = await fetch(proxyUrl);
        const data = await response.json();
        const result = JSON.parse(data.contents).chart.result[0];

        const price = result.meta.regularMarketPrice;
        const currency = result.meta.currency;
        const name = result.meta.shortName || result.meta.symbol;

        return { name, price: `${currency} $${price.toFixed(2)}` };
      } catch (error) {
        console.error(`獲取 ${symbol} 失敗:`, error);
        return { name: symbol, price: '更新失敗' };
      }
    }

    async function fetchAllPrices() {
      document.getElementById('updateTime').innerText = '正在更新股價...';
      
      for (let symbol of stockList) {
        stockData[symbol] = await fetchPrice(symbol);
        renderTable(); // 每抓好一隻股票即時更新 UI
      }

      const now = new Date();
      document.getElementById('updateTime').innerText = `最後更新: ${now.toLocaleTimeString()}`;
    }

    function renderTable() {
      const tbody = document.getElementById('stockTable');
      tbody.innerHTML = '';

      stockList.forEach((symbol, index) => {
        const info = stockData[symbol] || { name: symbol, price: '讀取中...' };
        tbody.innerHTML += `
          <tr>
            <td>
              <strong>${symbol}</strong><br>
              <small style="color:#6c757d">${info.name !== symbol ? info.name : ''}</small>
            </td>
            <td class="price ${info.price === '讀取中...' ? 'loading' : ''}">${info.price}</td>
            <td><button class="del-btn" onclick="deleteStock(${index})">刪除</button></td>
          </tr>
        `;
      });
    }

    function addStock() {
      const input = document.getElementById('symbolInput');
      let symbol = input.value.trim().toUpperCase();

      if (!symbol) return;

      // 自動幫純數字的港股補上 .HK (例: 700 -> 0700.HK)
      if (/^\d+$/.test(symbol)) {
        symbol = symbol.padStart(4, '0') + '.HK';
      }

      if (!stockList.includes(symbol)) {
        stockList.push(symbol);
        saveList();
        renderTable();
        fetchAllPrices();
      }

      input.value = '';
    }

    function deleteStock(index) {
      const symbol = stockList[index];
      stockList.splice(index, 1);
      delete stockData[symbol];
      saveList();
      renderTable();
    }

    // 初始化：顯示列表、抓取價格，並設定每 30 秒自動更新一次
    renderTable();
    fetchAllPrices();
    setInterval(fetchAllPrices, 30000);
  </script>

</body>
</html>
